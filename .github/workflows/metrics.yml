name: Generate Profile Assets

on:
  schedule:
    - cron: "0 */12 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Step 1: Generate Metrics Classic Card (commits directly to output branch via API)
      - name: Generate Metrics Classic Card
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_branch: output
          user: parthkprogrammer
          template: classic
          base: header, activity, community, repositories, metadata
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: bytes-size, percentage

      # Step 2: Generate Achievements (commits directly to output branch via API)
      - name: Generate Achievements
        uses: stalomeow/metrics@edcae0f
        with:
          filename: github-achievements.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_branch: output
          user: parthkprogrammer
          base: ""
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_display: compact
          debug: yes

      # Step 3: Checkout repository (on main branch)
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 4: Generate Snake SVGs
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: parthkprogrammer
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Step 5: Checkout output branch, copy snake SVGs, commit, and push
      - name: Deploy Snake to Output Branch
        run: |
          git fetch origin output
          git checkout output
          cp dist/github-contribution-grid-snake.svg .
          cp dist/github-contribution-grid-snake-dark.svg .
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add github-contribution-grid-snake.svg github-contribution-grid-snake-dark.svg
          git commit -m "Update contribution snake" --allow-empty
          git push origin output


